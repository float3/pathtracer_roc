name: Update flake.lock

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    name: Update inputs and check the dev shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update inputs
        # roc stays pinned: its main branch no longer ships a flake.nix and the
        # code targets the old basic-cli 0.8 syntax anyway.
        run: nix flake update nixpkgs flake-utils

      - name: Check the dev shell still evaluates
        run: nix develop --command roc version

      - name: Commit and push
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update flake.lock" flake.lock
          git push
