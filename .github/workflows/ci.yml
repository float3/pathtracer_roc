name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Check, build and render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Roc
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-08-30-34e7489

      - name: Check formatting
        run: roc fmt --check main.roc

      - name: Check
        run: roc check main.roc

      - name: Build
        run: roc build --opt=speed --output=pathtracer main.roc

      - name: Render
        run: ./pathtracer

      - name: Convert to PNG
        run: |
          pip install --quiet pillow
          python3 -c "from PIL import Image; Image.open('output.ppm').save('render.png')"

      - name: Upload render
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: render
          path: render.png
